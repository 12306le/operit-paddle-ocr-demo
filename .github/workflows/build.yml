name: Build Debug APK (Paddle)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# 关键:必须双 JDK
#   - JDK 17 用于跑 sdkmanager (runner 预装的 sdkmanager 是 class file v61,即 JDK 17)
#   - JDK 11 用于跑 Gradle 6.1.1 + AGP 4.0.1 (Gradle 6.x 不支持 JDK 17)
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (for sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          java-package: jdk

      - name: Install NDK 20.1.5948944 & CMake 3.10.2 (用 JDK 17)
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          set -e
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          echo "Using ANDROID_HOME=$ANDROID_HOME"
          echo "Using JAVA_HOME=$JAVA_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-29" \
            "build-tools;29.0.3" \
            "ndk;20.1.5948944" \
            "cmake;3.10.2.4988404" 2>&1 | tail -10
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/20.1.5948944" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/20.1.5948944" >> $GITHUB_ENV

      - name: Set up JDK 11 (for Gradle 6 + AGP 4.0.1)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Show environment
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk/"
          ./gradlew --version

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paddle-ocr-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/
          retention-days: 7
