name: Build Debug APK (Paddle)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11 (AGP 4.0.1 兼容)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 29

      - name: Install NDK r20b
        run: |
          cd "$ANDROID_HOME"
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;20.1.5948944" "cmake;3.10.2.4988404" | tail -5
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/20.1.5948944" >> $GITHUB_ENV

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Pre-download Paddle/OpenCV/model archives (~300MB)
        run: |
          ./gradlew :app:downloadAndExtractArchives --no-daemon --stacktrace
        continue-on-error: true

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: paddle-ocr-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
